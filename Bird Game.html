<!DOCTYPE html>
<html>
<head>
    <title>Bird Flying Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: skyblue;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        canvas {
            display: block;
            margin: auto;
            background: #70c5ce;
            border: 2px solid black;
        }

        #score {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 30px;
            color: white;
            font-weight: bold;
        }

        #gameOver {
            display: none;
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="score">Score: 0</div>

<div id="gameOver">
    <h2>Game Over!</h2>
    <p id="finalScore"></p>
    <button onclick="restartGame()">Replay</button>
</div>

<canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let bird, pipes, score, gameRunning;

function initGame() {
    bird = {
        x: 80,
        y: 250,
        width: 30,
        height: 30,
        gravity: 0.5,
        lift: -8,
        velocity: 0
    };

    pipes = [];
    score = 0;
    gameRunning = true;

    document.getElementById("score").innerText = "Score: 0";
    document.getElementById("gameOver").style.display = "none";

    createPipe();
}

function createPipe() {
    let gap = 150;
    let topHeight = Math.random() * 250 + 50;

    pipes.push({
        x: canvas.width,
        width: 60,
        top: topHeight,
        bottom: canvas.height - topHeight - gap,
        passed: false
    });
}

document.addEventListener("keydown", function(e) {
    if (e.code === "Space") {
        bird.velocity = bird.lift;
    }
});

canvas.addEventListener("click", () => {
    bird.velocity = bird.lift;
});

function update() {
    if (!gameRunning) return;

    bird.velocity += bird.gravity;
    bird.y += bird.velocity;

    if (bird.y < 0 || bird.y + bird.height > canvas.height) {
        gameOver();
    }

    for (let i = pipes.length - 1; i >= 0; i--) {
        pipes[i].x -= 3;

        if (
            bird.x < pipes[i].x + pipes[i].width &&
            bird.x + bird.width > pipes[i].x &&
            (
                bird.y < pipes[i].top ||
                bird.y + bird.height >
                canvas.height - pipes[i].bottom
            )
        ) {
            gameOver();
        }

        if (!pipes[i].passed && pipes[i].x + pipes[i].width < bird.x) {
            pipes[i].passed = true;
            score++;
            document.getElementById("score").innerText =
                "Score: " + score;
        }

        if (pipes[i].x < -pipes[i].width) {
            pipes.splice(i, 1);
        }
    }

    if (
        pipes.length === 0 ||
        pipes[pipes.length - 1].x < canvas.width - 200
    ) {
        createPipe();
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Bird
    ctx.fillStyle = "yellow";
    ctx.beginPath();
    ctx.arc(
        bird.x + bird.width / 2,
        bird.y + bird.height / 2,
        15,
        0,
        Math.PI * 2
    );
    ctx.fill();

    // Pipes
    ctx.fillStyle = "green";
    pipes.forEach(pipe => {
        ctx.fillRect(pipe.x, 0, pipe.width, pipe.top);

        ctx.fillRect(
            pipe.x,
            canvas.height - pipe.bottom,
            pipe.width,
            pipe.bottom
        );
    });
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

function gameOver() {
    gameRunning = false;

    document.getElementById("finalScore").innerText =
        "Your Score: " + score;

    document.getElementById("gameOver").style.display = "block";
}

function restartGame() {
    initGame();
}

initGame();
gameLoop();
</script>

</body>
</html>
<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let bird, pipes, score, gameRunning;

// ===== Sound Effects =====
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(freq, duration, type = "sine") {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.frequency.value = freq;
    osc.type = type;

    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioCtx.currentTime + duration
    );

    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function jumpSound() {
    playSound(700, 0.1, "square");
}

function scoreSound() {
    playSound(1000, 0.15, "triangle");
}

function gameOverSound() {
    playSound(300, 0.4, "sawtooth");
}
// =========================

function initGame() {
    bird = {
        x: 80,
        y: 250,
        width: 30,
        height: 30,
        gravity: 0.5,
        lift: -8,
        velocity: 0
    };

    pipes = [];
    score = 0;
    gameRunning = true;

    document.getElementById("score").innerText = "Score: 0";
    document.getElementById("gameOver").style.display = "none";

    createPipe();
}

function createPipe() {
    let gap = 150;
    let topHeight = Math.random() * 250 + 50;

    pipes.push({
        x: canvas.width,
        width: 60,
        top: topHeight,
        bottom: canvas.height - topHeight - gap,
        passed: false
    });
}

document.addEventListener("keydown", function(e) {
    if (e.code === "Space") {
        bird.velocity = bird.lift;
        jumpSound();
    }
});

canvas.addEventListener("click", () => {
    bird.velocity = bird.lift;
    jumpSound();
});

function update() {
    if (!gameRunning) return;

    bird.velocity += bird.gravity;
    bird.y += bird.velocity;

    if (bird.y < 0 || bird.y + bird.height > canvas.height) {
        gameOver();
    }

    for (let i = pipes.length - 1; i >= 0; i--) {
        pipes[i].x -= 3;

        if (
            bird.x < pipes[i].x + pipes[i].width &&
            bird.x + bird.width > pipes[i].x &&
            (
                bird.y < pipes[i].top ||
                bird.y + bird.height >
                canvas.height - pipes[i].bottom
            )
        ) {
            gameOver();
        }

        if (!pipes[i].passed && pipes[i].x + pipes[i].width < bird.x) {
            pipes[i].passed = true;
            score++;

            scoreSound();

            document.getElementById("score").innerText =
                "Score: " + score;
        }

        if (pipes[i].x < -pipes[i].width) {
            pipes.splice(i, 1);
        }
    }

    if (
        pipes.length === 0 ||
        pipes[pipes.length - 1].x < canvas.width - 200
    ) {
        createPipe();
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Bird
    ctx.fillStyle = "yellow";
    ctx.beginPath();
    ctx.arc(
        bird.x + bird.width / 2,
        bird.y + bird.height / 2,
        15,
        0,
        Math.PI * 2
    );
    ctx.fill();

    // Bird Eye
    ctx.fillStyle = "black";
    ctx.beginPath();
    ctx.arc(bird.x + 20, bird.y + 12, 3, 0, Math.PI * 2);
    ctx.fill();

    // Pipes
    ctx.fillStyle = "green";
    pipes.forEach(pipe => {
        ctx.fillRect(pipe.x, 0, pipe.width, pipe.top);

        ctx.fillRect(
            pipe.x,
            canvas.height - pipe.bottom,
            pipe.width,
            pipe.bottom
        );
    });
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

function gameOver() {
    if (!gameRunning) return;

    gameRunning = false;

    gameOverSound();

    document.getElementById("finalScore").innerText =
        "Your Score: " + score;

    document.getElementById("gameOver").style.display = "block";
}

function restartGame() {
    initGame();
}

initGame();
gameLoop();
</script>
